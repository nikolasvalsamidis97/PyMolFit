[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymolfit"
dynamic = ["version"]
description = "Independent pure-Python telluric correction based on the ESO Molecfit workflow."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
keywords = [
    "astronomy",
    "radiative transfer",
    "spectroscopy",
    "telluric correction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
authors = [
    { name = "Nikolas Valsamidis" }
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "astropy>=5.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "ruff>=0.8",
    "twine>=5.1",
]
examples = [
    "matplotlib>=3.7",
]
interactive = [
    "matplotlib>=3.7",
    "ipympl>=0.9",
]
plot = [
    "matplotlib>=3.7",
]

[project.scripts]
pymolfit = "pymolfit.cli:main"

[project.urls]
Homepage = "https://github.com/nikolasvalsamidis97/PyMolFit"
Issues = "https://github.com/nikolasvalsamidis97/PyMolFit/issues"
Repository = "https://github.com/nikolasvalsamidis97/PyMolFit.git"
Changelog = "https://github.com/nikolasvalsamidis97/PyMolFit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/nikolasvalsamidis97/PyMolFit#readme"

[tool.setuptools.dynamic]
version = { attr = "pymolfit._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pymolfit = [
    "py.typed",
    "data/*.npz",
    "data/profiles/gdas/*.fits",
    "data/profiles/mipas/*.fits",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "C4", "E4", "E7", "E9", "F", "I", "PERF", "PIE", "RUF", "SIM", "UP"]
ignore = ["RUF001"]
